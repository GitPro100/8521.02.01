document.body.classList.toggle('researcher-preview', preview);
const hostOrigin=qs.get('parent_origin')||'';const livePID=qs.get('pid')||qs.get('PROLIFIC_PID')||'';const liveConfig=qs.get('assignment')||'';

 try{window.parent.postMessage({type:'8521_0201_HEIGHT',height:h},target)}catch(e){}

function ratingScale(code,legend,anchorL,anchorR){const v=state[code];return `<fieldset class="q"><legend>${escapeHtml(legend)}</legend><div class="scale" role="radiogroup" aria-label="${escapeHtml(legend)}">${[1,2,3,4,5,6,7].map(i=>`<label><input name="${code}" type="radio" value="${i}" ${v===i?'checked':''}>${i}</label>`).join('')}</div><div class="anchors"><span>1 — ${anchorL}</span><span>7 — ${anchorR}</span></div></fieldset>`}
function ratingsScreen(){const order=state.A_position==='left'?['A','B']:['B','A'];return header('Product evaluations','About the Energy Bars')+`<p>Please evaluate <strong>each energy bar</strong> based on the information you saw.</p><div class="two">${order.map(l=>`<div><div class="product">${productCard(l,false).replace(/^<div class="product [^"]*">/,'').replace(/<\/div>$/,'')}</div>${ratingScale('fit_'+l,'How well does Energy Bar '+l+' match the stated nutritional objectives?','Very poorly','Very well')}${ratingScale('desirability_'+l,'How desirable do you find Energy Bar '+l+' overall?','Not at all desirable','Extremely desirable')}</div>`).join('')}</div>`}
function optionRows(name,opts,checked){return `<div class="choices">${opts.map(x=>`<label class="radio-line"><input type="radio" name="${name}" value="${escapeHtml(x.value)}" ${checked===x.value?'checked':''}>${escapeHtml(x.label)}</label>`).join('')}</div>`}
function demoScreen(){const d=SPEC.demographics;const gender=[['Female','female'],['Male','male'],['Nonbinary','nonbinary'],['Self-describe','self_describe']].map(([label,value])=>({label,value}));const edu=d.education.options.map(x=>({label:x.label,value:x.code}));const inc=d.income.options.map(x=>({label:x.label,value:x.code}));return header('Background','About You')+`<p>Please answer the following questions.</p><div class="two"><div><h2>Gender</h2>${optionRows('gender',gender,state.demographics.gender)}<div id="genderOther" class="${state.demographics.gender==='self_describe'?'':'hidden'}"><label for="genderText">Please describe</label><input type="text" id="genderText" maxlength="80" value="${escapeHtml(state.demographics.gender_text||'')}"></div><h2>Age</h2><label for="age">What is your age (in years)?</label><input id="age" type="number" min="18" max="80" step="1" inputmode="numeric" value="${escapeHtml(state.demographics.age||'')}"><p class="small muted">Enter a whole number from 18 to 80.</p><h2>Education</h2><p>What is your highest level of education?</p>${optionRows('education',edu,state.demographics.education)}</div><div><h2>Household annual income</h2><p>What is your household annual income?</p>${optionRows('income',inc,state.demographics.income)}</div></div>`}
function thankYouScreen(){
 return header('Thank you','Thank you for your participation.')+
  (isLive?'<p>You will be returned to the survey automatically.</p>':'')+
  `<p id="handoffStatus" role="status" aria-live="polite"></p>`+
  `<button type="button" id="retryHandoff" class="secondary hidden">Retry connection</button>`;
}
function stopHandoffTimers(){
 if(handoffTimer!==null){clearTimeout(handoffTimer);handoffTimer=null}
 if(handoffWatchdog!==null){clearTimeout(handoffWatchdog);handoffWatchdog=null}
}
function handoff(){
 handoffTimer=null;
 if(steps[step]!=='submit'||!validAll()||handoffStarted)return;
 if(preview){const s=$('handoffStatus');if(s)s.textContent='Researcher Preview: no live submission.';return;}
 if(!isLive){state.completion_status='demo_complete_not_recorded';save();const s=$('handoffStatus');if(s)s.textContent='Demonstration only: no response was sent to Qualtrics.';return;}
 handoffStarted=true;awaitingAck=true;
 state.completion_status='handoff_pending';save();
 const s=$('handoffStatus');if(s)s.textContent='Returning to the survey…';
 window.parent.postMessage({type:'8521_0201_SUBMIT',payload:collect()},hostOrigin);
 handoffWatchdog=setTimeout(()=>{
  if(awaitingAck&&steps[step]==='submit'){
   awaitingAck=false;handoffStarted=false;
   const status=$('handoffStatus');if(status)status.textContent='The survey connection has not responded. Your completion has not been confirmed.';
   const retry=$('retryHandoff');if(retry)retry.classList.remove('hidden');
  }
 },12000);
}
function scheduleHandoff(){
 if(steps[step]!=='submit'||handoffTimer!==null||handoffStarted)return;
 handoffTimer=setTimeout(handoff,3000);
}
function updateProgress(){$('progressLabel').textContent=preview?'Researcher preview':`Step ${Math.min(step+1,steps.length)} of ${steps.length}`;$('progressBar').style.width=`${Math.round((step+1)/steps.length*100)}%`}
function renderMeta(){const c=cfgLookup[state.configuration_id];$('researchMeta').textContent=c?`Assigned: ${c.id} · A = ${c.profile_A} (${c.A_position}); B = ${c.profile_B}. Baseline: no recommendation.`:''}
function draw(){
 if(validErr){$('screen').innerHTML=header('Device or link restriction','Unable to enter this study')+`<div class="mobile-block">${escapeHtml(validErr)}</div>`;$('buttons').classList.add('hidden');$('progressLabel').textContent='Access restricted';requestAnimationFrame(()=>{postFrameHeight();setTimeout(postFrameHeight,80);setTimeout(postFrameHeight,300)});return}
 if(!preview&&state.completion_status==='withdrawn'){$('screen').innerHTML=header('Participation ended','Your participation has ended.')+`<p>You may close this tab.</p>`;$('buttons').classList.add('hidden');requestAnimationFrame(()=>{postFrameHeight();setTimeout(postFrameHeight,80);setTimeout(postFrameHeight,300)});return}
 if(steps[step]==='choice'||steps[step]==='ratings')ensureAssigned();
 const body={consent:consentScreen,instructions:instructionsScreen,objectives:objectivesScreen,choice:choiceScreen,ratings:ratingsScreen,demographics:demoScreen,submit:thankYouScreen}[steps[step]]();
 $('screen').innerHTML=body;$('error').textContent='';
 const isThankYou=steps[step]==='submit';
 $('buttons').classList.toggle('hidden',isThankYou&&!preview);
 $('back').style.visibility=(preview&&step>0)?'visible':'hidden';
 $('next').classList.toggle('hidden',isThankYou);
 $('next').textContent='Continue';$('next').disabled=false;
 $('jump').value=steps[step];$('researcher').classList.toggle('hidden',!preview);
 $('cfgSelect').value=state.configuration_id||SPEC.design.configurations[0].id;
 updateProgress();renderMeta();wire();
 if(isThankYou){
  const retry=$('retryHandoff');if(retry)retry.addEventListener('click',()=>{retry.classList.add('hidden');handoffStarted=false;awaitingAck=false;handoff()});
  scheduleHandoff();
 }
 requestAnimationFrame(()=>{postFrameHeight();setTimeout(postFrameHeight,80);setTimeout(postFrameHeight,300)});
}
function wire(){for(const el of document.querySelectorAll('input[name=consent]'))el.addEventListener('change',e=>{state.consent_response=e.target.value;save()});for(const el of document.querySelectorAll('input[name=choice]'))el.addEventListener('change',e=>{setChoice(e.target.value);draw()});for(const group of ['fit_A','fit_B','desirability_A','desirability_B'])for(const el of document.querySelectorAll(`input[name=${group}]`))el.addEventListener('change',e=>{state[group]=Number(e.target.value);recalc();save()});for(const k of ['gender','education','income'])for(const el of document.querySelectorAll(`input[name=${k}]`))el.addEventListener('change',e=>{state.demographics[k]=e.target.value;if(k==='gender')draw();save()});const age=$('age');if(age)age.addEventListener('input',e=>{state.demographics.age=e.target.value;save()});const other=$('genderText');if(other)other.addEventListener('input',e=>{state.demographics.gender_text=e.target.value;save()})}
function validation(){switch(steps[step]){case'consent':return state.consent_response?'':'Please choose whether you agree to participate.';case'choice':return state.choice_label?'':'Please select one energy bar.';case'ratings':return ['fit_A','fit_B','desirability_A','desirability_B'].every(k=>Number.isInteger(state[k])&&state[k]>=1&&state[k]<=7)?'':'Please answer all four product-evaluation questions.';case'demographics':{const d=state.demographics;const age=Number(d.age);return !d.gender?'Please select your gender.':(d.gender==='self_describe'&&!(d.gender_text||'').trim())?'Please provide your gender description.':!Number.isInteger(age)||age<18||age>80?'Please enter an age from 18 to 80.':!d.education?'Please select your education category.':!d.income?'Please select your income category.':'';}default:return''}}
function validAll(){return state.consent_response==='agree'&&state.choice_label&&['fit_A','fit_B','desirability_A','desirability_B'].every(k=>Number.isInteger(state[k])&&state[k]>=1&&state[k]<=7)&&Boolean(state.demographics.gender)&&Boolean(state.demographics.education)&&Boolean(state.demographics.income)&&Number.isInteger(Number(state.demographics.age))&&Number(state.demographics.age)>=18&&Number(state.demographics.age)<=80&&(state.demographics.gender!=='self_describe'||Boolean((state.demographics.gender_text||'').trim()))}
function collect(){recalc();return {...state,completed_at:new Date().toISOString(),unadministered_main_study_variables:['RM','SD','PRMV','PST','Trust','RELInt','PRB','RELBhv'],data_notes:'No AI recommendation; choice_X is baseline profile preference, NOT recommendation reliance.'}}
function next(){if(step===steps.length-1)return;const error=validation();if(error){$('error').textContent=error;return}if(steps[step]==='consent'&&state.consent_response==='decline'){state.completion_status='withdrawn';state.completed=false;save();draw();return}if(steps[step]==='objectives'){ensureAssigned();}if(steps[step]==='demographics'&&!validAll()){$('error').textContent='Please complete all required questions before continuing.';return;}const from=steps[step];state.screen_time_ms[from]=(state.screen_time_ms[from]||0)+Math.max(0,Date.now()-(state.screen_start||Date.now()));state.screen_start=Date.now();navigate(step+1)}
function navigate(idx){stopHandoffTimers();if(idx!==steps.length-1){handoffStarted=false;awaitingAck=false;}if(fade!==null){clearTimeout(fade);fade=null}if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){step=idx;draw();return}$('screen').classList.add('hide');fade=setTimeout(()=>{step=idx;draw();$('screen').classList.add('hide');requestAnimationFrame(()=>requestAnimationFrame(()=>$('screen').classList.remove('hide')));fade=null},190)}
function exportData(format){const d=collect();if(format==='json')download(JSON.stringify(d,null,2),`8521.02.01_${d.configuration_id||'preview'}_test.json`,'application/json');else{const obj={...d,demographics:JSON.stringify(d.demographics),screen_time_ms:JSON.stringify(d.screen_time_ms)};download(Object.keys(obj).join(',')+'\n'+Object.values(obj).map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','),`8521.02.01_${d.configuration_id||'preview'}_test.csv`,'text/csv') }}
function download(s,name,type){const b=new Blob([s],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
$('next').addEventListener('click',next);$('back').addEventListener('click',()=>{if(preview&&step>0)navigate(step-1)});
$('resetPreview').addEventListener('click',()=>{if(!preview)return;const id=$('cfgSelect').value;state={...state,consent_response:null,choice_label:null,chosen_profile:null,choice_X:null,chosen_side:null,fit_A:null,fit_B:null,desirability_A:null,desirability_B:null,fit_X:null,fit_Y:null,desirability_X:null,desirability_Y:null,fit_X_minus_Y:null,desirability_X_minus_Y:null,demographics:{},completed:false,completion_status:'in_progress'};chooseConfig(id);navigate(0)});
$('cfgSelect').addEventListener('change',e=>{if(!preview)return;const id=e.target.value;state.choice_label=null;state.chosen_profile=null;state.choice_X=null;state.chosen_side=null;state.completed=false;state.completion_status='in_progress';chooseConfig(id);recalc();draw()});$('jump').addEventListener('change',e=>{if(preview)navigate(steps.indexOf(e.target.value))});$('exportJSON').addEventListener('click',()=>exportData('json'));$('exportCSV').addEventListener('click',()=>exportData('csv'));
if(isLive)window.addEventListener('message',e=>{
 if(!awaitingAck||e.source!==window.parent||e.origin!==hostOrigin)return;
 if(e.data?.type==='8521_0201_SUBMIT_ACK'&&e.data?.participant_id===livePID&&e.data?.configuration_id===state.configuration_id){
  awaitingAck=false;stopHandoffTimers();state.host_acknowledged=true;
  // An acknowledgment by Qualtrics JavaScript is not confirmation of server-side persistence.
  state.completion_status='transferred_to_qualtrics_pending_server_submission';save();
  const s=$('handoffStatus');if(s)s.textContent='Your responses have been transferred to the survey. Returning you now…';
 }else if(e.data?.type==='8521_0201_SUBMIT_NACK'){
  awaitingAck=false;handoffStarted=false;stopHandoffTimers();
  const s=$('handoffStatus');if(s)s.textContent='The response transfer was not accepted. Please try again or contact the researcher.';
  const r=$('retryHandoff');if(r)r.classList.remove('hidden');
 }
});
if(preview){$('researcher').classList.remove('hidden');chooseConfig(SPEC.design.configurations[0].id)}else if(isLive&&!validErr)chooseConfig(liveConfig);
// Server-side completion is decided by Qualtrics, never by this client alone.
window.addEventListener('resize',()=>setTimeout(postFrameHeight,60));
state.screen_start=Date.now();draw();
})();
</script></body></html>
